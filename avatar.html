<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amira · Garden Muse — 3D avatar</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eee8e1;color:#513c40;font-family:system-ui,sans-serif}
    #stage{height:calc(100vh - 128px);min-height:400px;width:100%;background:radial-gradient(ellipse at center,#fffaf1,#e6ddd8)}
    canvas{display:block;width:100%;height:100%}footer{text-align:center;padding:12px}h1{margin:0;font-size:22px}p{margin:4px 0 10px;font-size:14px}
    button,select{font:inherit;font-size:14px;color:#513c40;background:#fffaf1;border:1px solid #c9b7b1;border-radius:20px;padding:7px 13px;cursor:pointer;margin:2px}
    button:hover{background:#e6d6eb} @media(max-width:600px){#stage{height:calc(100vh - 190px)}footer{padding:8px}h1{font-size:18px}}
  </style>
</head>
<body>
  <div id="stage" aria-label="Interactive 3D avatar: drag to rotate and scroll to zoom"></div>
  <footer><h1>Amira · Garden Muse</h1><p>Original textured 3D avatar · Drag to rotate · Scroll to zoom</p>
    <button data-view="front">Front</button><button data-view="three-quarter">Three-quarter</button><button data-view="side">Side</button><button data-view="back">Back</button>
    <select id="clip" aria-label="Animation"></select><select id="lod" aria-label="Detail level"><option value="0">Full detail</option><option value="1">Distance model</option></select>
  </footer>
  <script type="module" src="/src/avatar-preview.js"></script>
</body></html>
